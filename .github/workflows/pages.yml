name: Deploy CyberOps Monitor showcase to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "index.html"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: cyberops-monitor-pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event.repository.private == false && github.event.repository.has_pages == true }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Stage the static dashboard only
        run: |
          mkdir -p _site
          cp index.html _site/index.html
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload static showcase
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
